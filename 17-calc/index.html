<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input, button { margin: 5px; padding: 8px; font-size: 16px; }
        .result { font-size: 24px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Калькулятор</h2>

    <input type="number" id="num1" placeholder="Число 1">
    <input type="number" id="num2" placeholder="Число 2">
    <br><br>

    <button onclick="calculate('+')">➕ Сложение</button>
    <button onclick="calculate('-')">➖ Вычитание</button>
    <button onclick="calculate('*')">✖️ Умножение</button>
    <button onclick="calculate('/')">➗ Деление</button>

    <div class="result">Результат: <span id="result">0</span></div>

    <script>
        function calculate(operation) {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const resultSpan = document.getElementById('result');

            if (isNaN(num1) || isNaN(num2)) {
                resultSpan.textContent = 'Ошибка: введите числа';
                return;
            }

            let result;
            switch (operation) {
                case '+': result = num1 + num2; break;
                case '-': result = num1 - num2; break;
                case '*': result = num1 * num2; break;
                case '/': 
                    if (num2 === 0) {
                        resultSpan.textContent = 'Ошибка: деление на 0';
                        return;
                    }
                    result = num1 / num2; 
                    break;
                default: return;
            }

            resultSpan.textContent = result;
        }
    </script>

</body>
</html>
